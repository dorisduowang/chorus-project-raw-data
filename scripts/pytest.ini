[pytest]
# CHORUS Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Fast isolated unit tests (no external dependencies)
    integration: Tests that require multiple components working together
    performance: Performance benchmarks and speed tests
    slow: Tests that take more than 5 seconds
    ner: Tests requiring spaCy NER (may be skipped if not installed)
    llm: Tests requiring LLM API calls (mocked by default)
    rag: Tests requiring the RAG server to be running

# Require markers to be defined
addopts = --strict-markers -v --tb=short

# Ignore deprecated warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for individual tests (requires pytest-timeout)
# timeout = 60

# Minimum test count to prevent empty runs
minversion = 7.0

# Console output settings
console_output_style = progress

# Parallel execution (requires pytest-xdist)
# addopts = -n auto
